<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop — FOUND.</title>
    <meta name="description" content="Drop 001. The F. Essential Tee, The Woven By Faith Tee, The F. Essential Cap." />
    <link rel="icon" href="assets/mark-f.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header" data-solid="true">
      <div class="nav-left">
        <button class="menu-btn" type="button" data-open-menu>Menu</button>
        <a class="nav-link" href="shop.html">Shop</a>
        <a class="nav-link" href="index.html#drop">Drop 001</a>
        <a class="nav-link" href="story.html">Story</a>
      </div>
      <a class="logo" href="index.html">FOUND.</a>
      <div class="nav-right">
        <button class="bag-btn" type="button" data-open-cart>
          Bag <span class="bag-count" data-bag-count>0</span>
        </button>
      </div>
    </header>

    <nav class="mobile-nav" aria-label="Mobile">
      <button class="mobile-close" type="button" data-close-menu>Close</button>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="story.html">Story</a>
    </nav>

    <main class="shop-page">
      <header class="page-hero">
        <p class="eyebrow">Drop 001</p>
        <h1 class="display">Shop</h1>
        <p>Faith | Purpose | Legacy</p>
      </header>

      <div class="shop-toolbar">
        <button class="filter-btn is-active" type="button" data-filter="all">All</button>
        <button class="filter-btn" type="button" data-filter="tops">Tops</button>
        <button class="filter-btn" type="button" data-filter="accessories">Caps</button>
        <button class="filter-btn" type="button" data-filter="sets">Sets</button>
      </div>

      <section class="shop-grid">
        <div class="product-grid" data-shop-grid></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-simple">
        <a class="logo" href="index.html">FOUND.</a>
        <p>Woven by faith.</p>
        <p>Cape Town, South Africa.</p>
      </div>
    </footer>

    <div class="cart-backdrop" data-close-cart></div>
    <aside class="cart" aria-label="Bag">
      <div class="cart-head">
        <h2>Bag</h2>
        <button type="button" data-close-cart>Close</button>
      </div>
      <div class="cart-body" data-cart-body></div>
      <div class="cart-foot" data-cart-foot hidden>
        <div class="cart-subtotal">
          <span>Subtotal</span>
          <span data-subtotal>R0</span>
        </div>
        <a class="checkout-btn" href="checkout.html">Checkout</a>
        <p class="checkout-note">Bank transfer only. Delivery is added at checkout.</p>
      </div>
    </aside>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
