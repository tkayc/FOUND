<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product — FOUND.</title>
    <meta name="description" content="Drop 001 from FOUND." />
    <link rel="icon" href="assets/mark-f.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header" data-solid="true">
      <div class="nav-left">
        <button class="menu-btn" type="button" data-open-menu>Menu</button>
        <a class="nav-link" href="shop.html">Shop</a>
        <a class="nav-link" href="index.html#drop">Drop 001</a>
        <a class="nav-link" href="story.html">Story</a>
      </div>
      <a class="logo" href="index.html">FOUND.</a>
      <div class="nav-right">
        <button class="bag-btn" type="button" data-open-cart>
          Bag <span class="bag-count" data-bag-count>0</span>
        </button>
      </div>
    </header>

    <nav class="mobile-nav" aria-label="Mobile">
      <button class="mobile-close" type="button" data-close-menu>Close</button>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="story.html">Story</a>
    </nav>

    <main class="pdp" data-pdp>
      <div class="pdp-gallery">
        <div class="pdp-gallery__main">
          <img data-pdp-main src="images/black_tee_front.jpeg" alt="" />
        </div>
        <div class="pdp-thumbs" data-pdp-thumbs></div>
      </div>
      <div class="pdp-info">
        <h1 class="display" data-pdp-name>The F. Essential Tee</h1>
        <p class="eyebrow" data-pdp-drop>Drop 001</p>
        <p class="pdp-price" data-pdp-price>R549</p>

        <div class="color-row">
          <p>Colour</p>
          <div class="color-options" data-color-options></div>
        </div>

        <div class="size-row">
          <p>Size</p>
          <div class="size-options" data-size-options></div>
        </div>

        <div class="qty-row">
          <p>Quantity</p>
          <div class="qty-picker">
            <button type="button" data-pdp-qty="-1" aria-label="Decrease quantity">−</button>
            <input
              type="number"
              min="1"
              max="20"
              value="1"
              inputmode="numeric"
              data-pdp-qty-input
              aria-label="Quantity"
            />
            <button type="button" data-pdp-qty="1" aria-label="Increase quantity">+</button>
          </div>
        </div>

        <button class="add-btn" type="button" data-add>Add to bag</button>

        <div class="pdp-acc">
          <div class="pdp-acc__item" data-acc-item>
            <button type="button" data-acc>Details <span>+</span></button>
            <div class="pdp-acc__body" data-acc-details></div>
          </div>
          <div class="pdp-acc__item" data-acc-item>
            <button type="button" data-acc>Size &amp; Fit <span>+</span></button>
            <div class="pdp-acc__body" data-acc-fit></div>
          </div>
          <div class="pdp-acc__item" data-acc-item>
            <button type="button" data-acc>Delivery &amp; Returns <span>+</span></button>
            <div class="pdp-acc__body" data-acc-delivery></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-simple">
        <a class="logo" href="index.html">FOUND.</a>
        <p>Woven by faith.</p>
        <p>Cape Town, South Africa.</p>
      </div>
    </footer>

    <div class="cart-backdrop" data-close-cart></div>
    <aside class="cart" aria-label="Bag">
      <div class="cart-head">
        <h2>Bag</h2>
        <button type="button" data-close-cart>Close</button>
      </div>
      <div class="cart-body" data-cart-body></div>
      <div class="cart-foot" data-cart-foot hidden>
        <div class="cart-subtotal">
          <span>Subtotal</span>
          <span data-subtotal>R0</span>
        </div>
        <a class="checkout-btn" href="checkout.html">Checkout</a>
        <p class="checkout-note">Bank transfer only. Delivery is added at checkout.</p>
      </div>
    </aside>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
